name: Deploy to Cloudflare Pages

# hit-panel's Pages project is Direct Upload (not Git-connected), so a push to main does NOT
# auto-deploy the way the marketing site does. This workflow closes that gap: on every push to
# main it builds and deploys to the existing `hit-panel` Pages project via wrangler.
#
# Requires one repo secret: CLOUDFLARE_API_TOKEN — a token with "Cloudflare Pages: Edit" on the
# Honchkrow1995 account (b91df20a84a77a2eda9dcc47a7bead73). Account ID below is not sensitive.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b91df20a84a77a2eda9dcc47a7bead73
          command: pages deploy dist --project-name=hit-panel --branch=main
